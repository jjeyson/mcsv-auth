quarkus.application.name=mcsv-auth

# PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}
quarkus.hibernate-orm.database.default-schema=data
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.database.start-offline=true
quarkus.hibernate-orm.database.version-check.enabled=false
quarkus.hibernate-orm.log.sql=${HIBERNATE_LOG_SQL:false}

# JWT. En producción ambas claves se montan como secretos en el contenedor.
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:file:/run/secrets/jwt/public_key.pem}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:file:/run/secrets/jwt/private_key.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:https://auth-service.kuarqus.com}
jwt.issuer=${JWT_ISSUER:https://auth-service.kuarqus.com}
jwt.duration=3600
jwt.refresh.duration=86400

# Rutas públicas bajo el root path real del servicio.
quarkus.http.auth.permission.public.paths=/mcsv-auth/auth/login,/mcsv-auth/auth/register,/mcsv-auth/auth/refresh,/mcsv-auth/q/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# HTTP. El gateway es el único punto público y gestiona CORS.
quarkus.http.host=${HTTP_HOST:0.0.0.0}
quarkus.http.port=${HTTP_PORT:9001}
quarkus.http.root-path=/mcsv-auth
quarkus.http.cors.enabled=false

quarkus.log.console.enable=true
quarkus.log.console.color=true
quarkus.log.console.level=INFO
quarkus.log.level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# Swagger UI: un único esquema Bearer JWT.
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearerAuth
