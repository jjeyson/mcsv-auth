# Configuración de PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DB_URL}

quarkus.hibernate-orm.database.default-schema=data
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.http.root-path=/mcsv-auth
# Configuración de JWT
# mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
# quarkus.smallrye-jwt.sign.key-location=META-INF/resources/privateKey.pem

# Configuración de JWT con archivos en el mismo directorio
mp.jwt.verify.publickey.location=META-INF/resources/public_key.pem
smallrye.jwt.sign.key.location=META-INF/resources/private_key.pem

mp.jwt.verify.issuer=${JWT_ISSUER:https://auth-service.kuarqus.com}

# Rutas públicas (necesarias para poder autenticarse)
quarkus.http.auth.permission.public.paths=/mcsv-auth/auth/login,/mcsv-auth/auth/register,/mcsv-auth/auth/refresh,/mcsv-auth/q/*
quarkus.http.auth.permission.public.policy=permit

# Todo lo demás requiere JWT válido
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# JWT Token Configuration
jwt.issuer=${JWT_ISSUER:https://auth-service.kuarqus.com}
jwt.duration=3600
jwt.refresh.duration=86400


# HTTP Configuration
quarkus.http.host=${HTTP_HOST:0.0.0.0}
quarkus.http.port=${HTTP_PORT:9001}
quarkus.http.cors.enabled=false

# quarkus.smallrye-jwt.token.header=Authorization
# quarkus.smallrye-jwt.token.cookie=
# quarkus.smallrye-jwt.auth-mechanism=MP-JWT
# quarkus.smallrye-jwt.expiration=3600
quarkus.log.category."io.quarkus.smallrye.jwt".level=DEBUG
quarkus.log.category."io.smallrye.jwt".level=DEBUG
quarkus.log.category."io.quarkus.vertx.http.runtime.security".level=DEBUG
