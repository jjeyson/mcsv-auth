name: Build JVM Quarkus Application VI
#actualizacion 2
on:
  workflow_dispatch:
  push:
    branches:
      - developer
  pull_request:
    branches:
      - developer
permissions:
  contents: read
  packages: read


jobs:
  build-jvm:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcsv_auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mcsv_auth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21 y Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      - name: Habilitar Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar y ejecutar pruebas
        run: ./mvnw -B --no-transfer-progress -U clean test
        env:
          MAVEN_USERNAME: jjeyson
          MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}

          QUARKUS_DATASOURCE_DB_KIND: postgresql
          QUARKUS_DATASOURCE_USERNAME: postgres
          QUARKUS_DATASOURCE_PASSWORD: postgres
          QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/mcsv_auth

