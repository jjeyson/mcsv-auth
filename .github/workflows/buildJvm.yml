name: Build JVM Quarkus Application VI
#actualizacion 2
on:
  workflow_dispatch:
  push:
    branches:
      - developer
  pull_request:
    branches:
      - developer
permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-jvm:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21 y Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      - name: Habilitar Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar y ejecutar pruebas
        run: ./mvnw -B --no-transfer-progress -U clean test
        env:
          MAVEN_USERNAME: jjeyson
          MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}

