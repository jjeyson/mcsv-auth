name: Native CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  JAVA_VERSION: "21"
  NATIVE_ARTIFACT: native-runner-${{ github.sha }}
  MAVEN_USERNAME: ${{ secrets.MAVEN_PACKAGE_USERNAME || github.actor }}
  MAVEN_TOKEN: ${{ secrets.MAVEN_PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  test:
    name: Pruebas JVM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java y acceso a GitHub Packages
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      - name: Habilitar Maven Wrapper
        run: chmod +x mvnw

      - name: Ejecutar pruebas
        run: ./mvnw -B --no-transfer-progress clean test

  native:
    name: Binario nativo Linux AMD64
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java y acceso a GitHub Packages
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      - name: Habilitar Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar ejecutable nativo
        run: >-
          ./mvnw -B --no-transfer-progress clean package
          -Dnative
          -DskipTests
          -Dquarkus.native.container-build=true

      - name: Verificar ejecutable
        shell: bash
        run: |
          set -euo pipefail
          runner="$(find target -maxdepth 1 -type f -name '*-runner' -print -quit)"
          test -n "$runner"
          test -x "$runner"
          file "$runner"

      - name: Guardar binario
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NATIVE_ARTIFACT }}
          path: target/*-runner
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publicar imagen y release
    needs: native
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Recuperar binario nativo
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.NATIVE_ARTIFACT }}
          path: target

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular etiquetas OCI
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Publicar imagen nativa
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.native
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Adjuntar binario a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          runner="$(find target -maxdepth 1 -type f -name '*-runner' -print -quit)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$runner" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$runner" --verify-tag --generate-notes
          fi
